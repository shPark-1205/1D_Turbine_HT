[project]
name = "internal-passage-1d"
version = "0.1.0"
description = "Prototype 1D heat-transfer and pressure-drop solver for gas turbine internal cooling passages."
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "Pillow>=10.0"]

[project.scripts]
internal-passage-gui = "internal_passage_1d.gui:main"

[project.optional-dependencies]
coolprop = ["CoolProp>=6.6"]
image = ["Pillow>=10.0", "matplotlib>=3.8"]
streamlit = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "Pillow>=10.0", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
